[UI]
SetupWizardIncomplete = false
StartFullscreen = true
ConfirmShutdown = false
HideMouseCursor = true

[Folders]
Bios = bios

[Filenames]
BIOS = __BIOS__

[GameList]
Paths = /jogo

[EmuCore]
EnableCheats = false
EnableFastBoot = true

[EmuCore/Speedhacks]
vuThread = true

[EmuCore/GS]
# 13 = Software: a VPS normal nao tem placa de video
Renderer = 13
upscale_multiplier = 1
extrathreads = __THREADS__
AspectRatio = 4:3

